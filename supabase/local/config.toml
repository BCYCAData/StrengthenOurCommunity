# CLI workdir is staged in .supabase-local to keep this bootstrap local-only.
project_id = "strengthen-community-test"

[api]
enabled = true
port = 54821
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54822
shadow_port = 54820
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54823
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54824

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"

[realtime]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
